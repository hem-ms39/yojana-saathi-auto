# Local full-stack run:  cp .env.example .env  (fill keys or leave blank for offline/demo)  then
#   docker compose up --build
# Frontend → http://localhost:3000   Backend → http://localhost:8000/docs   OCR → http://localhost:8001/docs
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: yojana-saathi-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      M3_API_URL: http://ocr:8001
      FRONTEND_URL: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [ocr]

  ocr:
    build: ./m3_workspace
    image: yojana-saathi-ocr:local
    env_file:
      - path: .env
        required: false
    ports: ["8001:8001"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    image: yojana-saathi-frontend:local
    ports: ["3000:3000"]
    depends_on: [backend]
