[project]
name = "yojana-saathi-backend"
version = "0.1.0"
description = "FastAPI backend for Yojana Saathi"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sse-starlette==2.1.3",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "python-dotenv==1.1.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "langgraph==0.2.67",
  "qdrant-client==1.12.1",
  "groq==0.11.0",
  "google-generativeai==0.8.5",
  "openai==1.79.0",
  "supabase==2.15.1",
  "twilio==9.6.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.8",
  "black==25.1.0",
  "mypy==1.15.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "routers*", "services*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
