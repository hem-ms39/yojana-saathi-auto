# Continuous Integration — runs on every push and every pull request.
# Each job is owned by one team member (see TEAM_PLAN.md); a PR can only be
# merged into main when ALL jobs are green (enforced by branch protection).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Member 1 ─────────────────────────────────────────────────────────────
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest + coverage)
        run: pytest --cov=. --cov-report=term-missing --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/pytest-report.xml

  # ── Member 4 ─────────────────────────────────────────────────────────────
  ocr-service:
    name: OCR service · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m3_workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: m3_workspace/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -v

  # ── Member 3 ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000/v1
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npx next lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  # ── Member 2 ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Security · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (fails if API keys / tokens are committed)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 \
            detect --source /repo --redact --verbose

  docker-smoke:
    name: Docker · build images + smoke test
    runs-on: ubuntu-latest
    needs: [backend, ocr-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: yojana-saathi-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build OCR image
        uses: docker/build-push-action@v6
        with:
          context: m3_workspace
          tags: yojana-saathi-ocr:ci
          load: true
          cache-from: type=gha,scope=ocr
          cache-to: type=gha,mode=max,scope=ocr
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: yojana-saathi-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Smoke test — containers start and answer
        run: |
          docker run -d --name api -p 8000:10000 yojana-saathi-backend:ci
          docker run -d --name web -p 3000:3000 yojana-saathi-frontend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/v1/schemes/pm-mudra-shishu | grep -q MUDRA
          curl -fsS -o /dev/null -w "frontend HTTP %{http_code}\n" http://localhost:3000/
      - name: Container logs on failure
        if: failure()
        run: docker logs api; docker logs web
