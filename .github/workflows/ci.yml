# Continuous Integration — runs on every push and every pull request.
# Each job is owned by one team member (see TEAM_PLAN.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Member 4 ─────────────────────────────────────────────────────────────
  ocr-service:
    name: OCR service · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m3_workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: m3_workspace/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -v
